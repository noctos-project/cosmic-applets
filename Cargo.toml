[workspace]
default-members = ["cosmic-applets", "cosmic-panel-button"]
members = [
    "cosmic-app-list",
    "cosmic-app-list/cosmic-app-list-config",
    "cosmic-applets",
    "cosmic-applet-audio",
    "cosmic-applet-battery",
    "cosmic-applet-bluetooth",
    "cosmic-applet-minimize",
    "cosmic-applet-network",
    "cosmic-applet-notifications",
    "cosmic-applet-osk",
    "cosmic-applet-power",
    "cosmic-applet-status-area",
    "cosmic-applet-tiling",
    "cosmic-applet-time",
    "cosmic-applet-workspaces",
    "cosmic-panel-button",
    "cosmic-applet-input-sources",
    "cosmic-applet-a11y",
    "cosmic-applets-config",
]

resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
cosmic-applets-config = { path = "cosmic-applets-config" }
cosmic-launch = { git = "https://github.com/pop-os/libcosmic" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-osk-config = { git = "https://github.com/pop-os/cosmic-osk" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = [
    "client",
], rev = "c0cff4d" }

futures = "0.3"
futures-util = "0.3"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
rust-embed = "8.11.0"
rust-embed-utils = "8.11.0"
rustc-hash = "2.1"
rustix = { version = "1.1", features = ["fs", "process", "shm"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-log = "0.2.0"
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
zlink = "0.8.0"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[workspace.metadata.cargo-machete]
ignored = ["libcosmic"]

# [patch."https://github.com/pop-os/libcosmic/"]
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# cosmic-launch = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# iced_futures = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-launch = { path = "../libcosmic/cosmic-launch" }
# libcosmic = { path = "../libcosmic" }
# iced_futures = { path = "../libcosmic/iced/futures" }

[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

# [patch.'https://github.com/pop-os/dbus-settings-bindings']
# cosmic-dbus-networkmanager = { path = "../dbus-settings-bindings/networkmanager" }
# upower_dbus = { path = "../dbus-settings-bindings/upower" }
# nm-secret-agent-manager = { path = "../dbus-settings-bindings/nm-secret-agent-manager" }

# NoctOS: illumos-patched crates from the sibling fork checkouts, as in the
# other NoctOS forks.
[patch.crates-io]
calloop = { path = "../cosmic-comp/noctos-vendor/calloop" }
polling = { path = "../cosmic-comp/noctos-vendor/polling" }
wayland-backend = { path = "../cosmic-comp/noctos-vendor/wayland-backend" }
# pulled in by softbuffer (software renderer); rustix has no ioctl opcode
# helpers on illumos
drm-ffi = { path = "../cosmic-comp/noctos-vendor/drm-ffi-0.7" }

# NoctOS: pop-os/winit at the pinned rev 9567503 plus an illumos arm for
# is_main_thread. Every crate of that workspace is redirected so the types
# stay identical across the dependency graph.
[patch."https://github.com/pop-os/winit.git"]
dpi = { path = "../cosmic-launcher/noctos-vendor/winit/dpi" }
winit = { path = "../cosmic-launcher/noctos-vendor/winit/winit" }
winit-android = { path = "../cosmic-launcher/noctos-vendor/winit/winit-android" }
winit-appkit = { path = "../cosmic-launcher/noctos-vendor/winit/winit-appkit" }
winit-common = { path = "../cosmic-launcher/noctos-vendor/winit/winit-common" }
winit-core = { path = "../cosmic-launcher/noctos-vendor/winit/winit-core" }
winit-orbital = { path = "../cosmic-launcher/noctos-vendor/winit/winit-orbital" }
winit-uikit = { path = "../cosmic-launcher/noctos-vendor/winit/winit-uikit" }
winit-wayland = { path = "../cosmic-launcher/noctos-vendor/winit/winit-wayland" }
winit-web = { path = "../cosmic-launcher/noctos-vendor/winit/winit-web" }
winit-win32 = { path = "../cosmic-launcher/noctos-vendor/winit/winit-win32" }
winit-x11 = { path = "../cosmic-launcher/noctos-vendor/winit/winit-x11" }

# NoctOS: pop-os/softbuffer (tag cosmic-4.0, c2b2c19) with a POSIX-correct
# shm_open name.
[patch."https://github.com/pop-os/softbuffer"]
softbuffer = { path = "../cosmic-launcher/noctos-vendor/softbuffer" }

# NoctOS: libcosmic from the sibling fork checkout (pop-os/libcosmic 896b252,
# the rev this tree locks, plus the fix that makes per-surface views work on
# non-Linux Wayland platforms). Every crate that comes from that repository is
# redirected so there is a single copy of each in the dependency graph.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
build_helpers = { path = "../libcosmic/iced/build_helpers" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-launch = { path = "../libcosmic/cosmic-launch" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }
